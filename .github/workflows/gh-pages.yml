name: github pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash .github/workflows/build.sh

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/html

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Translation QA (structure checker)
        run: python3 tools/fa/check.py

      - name: Build (with linkcheck removed)
        run: bash .github/workflows/build.sh
