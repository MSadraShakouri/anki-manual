name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      # NOTE: there is intentionally no `workflows: write` here. It is not a
      # valid GITHUB_TOKEN permission, and using it makes this whole file
      # invalid so the workflow stops running entirely. GITHUB_TOKEN can
      # never push commits that create or update .github/workflows/*; the
      # mirror push in the last step uses the SYNC_TOKEN secret instead.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure 'sync' label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sync \
            --description "Upstream commit waiting to be translated/merged" \
            --color 5319E7 || echo "label 'sync' already exists"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/ankitects/anki-manual.git
          git fetch upstream
          git fetch origin upstream || true

      - name: Find new upstream commits
        id: find
        run: |
          git rev-parse origin/upstream >/dev/null 2>&1 || git branch origin/upstream upstream/main
          echo "count=$(git rev-list --count origin/upstream..upstream/main)" >> $GITHUB_OUTPUT
          git rev-list --reverse origin/upstream..upstream/main > new-commits.txt

      - name: Create issues for new commits
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh repo set-default "$GITHUB_REPOSITORY"

          while IFS= read -r sha; do
            short="${sha:0:7}"
            title="[$(git log -1 --format='%cs' "$sha")] Sync upstream commit ${short}"

            if gh issue list --label sync --json title -q '.[] | select(.title | endswith("'"${short}"'")) | .title' | grep -q .; then
              echo "Issue already exists for $sha, skipping"
              continue
            fi

            files=$(git diff --name-only "$sha^" "$sha" -- src | sed 's|^src/||' || true)

            body="## Upstream commit
            - **SHA**: \`${sha}\`
            - **Date**: $(git log -1 --format='%cs' "$sha")
            - **Author**: $(git log -1 --format='%an' "$sha")
            - **Link**: https://github.com/ankitects/anki-manual/commit/${sha}

            ## Message
            $(git log -1 --format='%B' "$sha")

            ## Manual files touched
            \`\`\`
            ${files}
            \`\`\`"

            gh issue create \
              --title "$title" \
              --body "$body" \
              --label sync && echo "Created issue for $sha" || echo "::warning::could not create issue for $sha (will retry tomorrow)"
          done < new-commits.txt

      - name: Update origin/upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT used only for the mirror push: classic token with
          # 'repo' + 'workflow' scopes, or fine-grained token with Contents
          # read/write + Workflows read/write on this repository. Needed
          # because GITHUB_TOKEN can never push refs that touch
          # .github/workflows/*, which upstream's Dependabot bumps regularly
          # do. Without it, issues are still created daily, but the mirror
          # branch cannot advance past such commits.
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          token="${SYNC_TOKEN:-$GITHUB_TOKEN}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"

          # Scoped credential override: only this push authenticates with the
          # chosen token; the earlier fetch of the public upstream repo keeps
          # using the default GITHUB_TOKEN credentials persisted by checkout.
          if git -c "http.https://github.com/.extraheader=$auth" \
               push origin upstream/main:refs/heads/upstream --force 2>&1 | tee push.log; then
            echo "Mirror branch 'upstream' updated."
          else
            if grep -qi "workflow" push.log; then
              if [ -z "${SYNC_TOKEN:-}" ]; then
                echo "::error::The upstream history contains changes to .github/workflows/* (upstream Dependabot action bumps), and the default GITHUB_TOKEN is never allowed to create or update workflow files. To fix this permanently: create a personal access token (classic token with 'repo' and 'workflow' scopes, or a fine-grained token with Contents: read/write and Workflows: read/write on this repository), add it as the SYNC_TOKEN secret in Settings > Secrets and variables > Actions, then re-run this workflow."
              else
                echo "::error::SYNC_TOKEN was rejected by the push. Make sure the token is valid and has workflow access (classic: 'repo' + 'workflow' scopes; fine-grained: Contents and Workflows read/write on this repository)."
              fi
            else
              echo "::error::git push failed; see the output above."
            fi
            exit 1
          fi
