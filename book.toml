[book]
authors = ["Ankitects Pty Ltd و همکاران"]
description = "راهنمای کاربری آنکی. آنکی برنامه‌ای مبتنی بر کارت است که یادگیری را آسان‌تر می‌کند."
language = "fa"
src = "src"
title = "راهنمای آنکی"

[build]
create-missing = true

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.3" # do not edit: managed by `mdbook-admonish install`

[output.html]
git-repository-url = "https://github.com/MSadraShakouri/anki-manual"
additional-css = ["css/misc.css", "css/mdbook-admonish.css", "css/rtl-fa.css"]
smart-punctuation = false
mathjax-support = true

[output.linkcheck]
optional = true
warning-policy = "warn"
follow-web-links = true
exclude = [
  'microsoft.com',
  'twitter.com',
  'stackexchange.com',
  'stackoverflow.com',
  'https://github.com/open-spaced-repetition/fsrs4anki#add-on-compatibility',
  'support.google.com',
  'wikiwiki.jp',
  'web.archive.org',
]

[output.html.fold]
enable = true
level = 0
